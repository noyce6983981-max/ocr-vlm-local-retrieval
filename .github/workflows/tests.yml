name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CPU test dependencies
        run: python -m pip install --requirement requirements-ci.txt
      - name: Run public-release safety audit
        run: python scripts/check_public_release.py .
      - name: Run unit tests
        run: python -m pytest -q
