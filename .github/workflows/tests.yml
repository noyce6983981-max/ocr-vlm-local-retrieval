name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CPU test dependencies
        run: python -m pip install --requirement requirements-ci.txt
      - name: Run public-release safety audit
        run: python scripts/check_public_release.py .
      - name: Ruff
        run: python -m ruff check src scripts tests
      - name: Strict V17 Ruff
        run: >-
          python -m ruff check --isolated
          --target-version py311
          --line-length 88
          --select E,F,I,UP,B,SIM
          --ignore E402
          scripts/*v17*.py
          scripts/*visual_attribute*.py
          tests/*v17*.py
          tests/*attribute*.py
      - name: Type check core package
        run: python -m mypy src/ocr_vlm_retrieval
      - name: Run tests with core coverage gate
        run: >-
          python -m pytest -q
          --cov=ocr_vlm_retrieval
          --cov-report=term-missing
          --cov-fail-under=85
