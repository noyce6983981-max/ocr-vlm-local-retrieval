[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = [
  "B007",
  "B018",
  "B905",
  "E402",
  "E501",
  "I001",
  "SIM103",
  "SIM108",
  "SIM114",
  "UP012",
  "UP017",
  "UP035",
]
"tests/*.py" = ["B018", "E402", "I001", "UP017"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true

[tool.coverage.run]
branch = true
source = ["src/ocr_vlm_retrieval"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  'if __name__ == .__main__.:',
  '\.\.\.',
]
